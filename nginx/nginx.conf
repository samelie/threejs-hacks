user nginx;
worker_processes auto;

# Set worker_rlimit_nofile to a high value to handle more connections
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    # Enable multi_accept for better performance
    multi_accept on;
    # Use epoll on Linux
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimized log format with cache status
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$upstream_cache_status"';

    access_log /var/log/nginx/access.log main buffer=16k;

    # File handling optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 10m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Enable gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Cache settings
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static file caching
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        ~image/                    max;
        ~font/                     max;
    }
    expires $expires;

    # Server tokens off
    server_tokens off;

    server {
        listen 80;
        server_name _;  # Catches all server names

            # Add these lines
        root /usr/share/nginx/html;  # or whatever path contains your web files
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Your existing location blocks go here
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
            access_log off;
            tcp_nodelay off;
            try_files $uri =404;
        }

        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
            access_log off;
            tcp_nodelay off;
            try_files $uri =404;
        }

        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1w;
            add_header Cache-Control "public, no-transform";
            access_log off;
            tcp_nodelay off;
            try_files $uri =404;
        }
    }

    # Include additional configs
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    # Set real IP from GCP load balancer
    set_real_ip_from 130.211.0.0/22;
    set_real_ip_from 35.191.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
}
